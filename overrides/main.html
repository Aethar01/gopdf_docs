{% extends "base.html" %}

{% block extrahead %}
  <script>
  (function() {
    // Project path where versions.json is located
    var PROJECT_PATH = '/gopdf_docs';
    var origFetch = window.fetch.bind(window);

    // Material's mike provider uses XMLHttpRequest for versions.json. GitHub Pages
    // serves the project at /gopdf_docs, while the provider requests /versions.json.
    var origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url) {
      try {
        var parsed = new URL(url, location.href);
        if (parsed.pathname === '/versions.json') {
          url = location.origin + PROJECT_PATH + '/versions.json';
        }
      } catch (e) {
        // If anything goes wrong, fall back to the original URL.
      }
      return origOpen.apply(this, [method, url].concat(Array.prototype.slice.call(arguments, 2)));
    };

    // Keep the same redirect for integrations that use fetch instead.
    window.fetch = function(input, init) {
      try {
        var url = (typeof input === 'string') ? input : (input instanceof Request ? input.url : input);
        var parsed = new URL(url, location.href);

        if (parsed.pathname === '/versions.json') {
          var proxy = location.origin + PROJECT_PATH + '/versions.json';
          return origFetch(proxy, init);
        }
      } catch (e) {
        // If anything goes wrong, fall back to the original fetch
      }
      return origFetch(input, init);
    };

    // The root build makes mike's version links relative to the domain root.
    // Add the GitHub Pages project prefix before the browser follows them.
    function prefixVersionLink(event) {
      var link = event.target.closest && event.target.closest('a');
      if (!link || !link.href) return;

      try {
        var parsed = new URL(link.href, location.href);
        var isVersion = parsed.origin === location.origin &&
          /^\/(?:git|v?\d[^/]*)(?:\/|$)/.test(parsed.pathname);
        if (isVersion && parsed.pathname.indexOf(PROJECT_PATH + '/') !== 0) {
          parsed.pathname = PROJECT_PATH + parsed.pathname;
          link.href = parsed.href;
        }
      } catch (e) {
        // Leave links unchanged if they cannot be parsed.
      }
    }

    document.addEventListener('pointerover', prefixVersionLink, true);
    document.addEventListener('click', prefixVersionLink, true);
  })();
  </script>
  {{ super() }}
{% endblock %}
